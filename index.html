<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101a2b"><title>Windows 11 Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="desktop" class="wallpaper-bloom">
  <div class="desktop-icons">
    <button class="desktop-icon" data-open="explorer"><span>📁</span><small>File Explorer</small></button>
    <button class="desktop-icon" data-open="maker"><span>🌐</span><small>Website Maker</small></button>
    <button class="desktop-icon" data-open="notepad"><span>📝</span><small>Notepad</small></button>
    <button class="desktop-icon" data-open="settings"><span>⚙️</span><small>Settings</small></button>
    <button class="desktop-icon" data-open="recycle"><span>🗑️</span><small>Recycle Bin</small></button>
  </div>
  <section id="startMenu" class="start-menu glass hidden">
    <div class="start-search"><span>⌕</span><input id="startSearch" placeholder="Search for apps, settings, and documents"></div>
    <div class="start-heading"><b>Pinned</b><span>All apps　›</span></div>
    <div class="pinned-grid">
      <button data-open="maker"><i>🌐</i>Website Maker</button><button data-open="explorer"><i>📁</i>File Explorer</button>
      <button data-open="notepad"><i>📝</i>Notepad</button><button data-open="settings"><i>⚙️</i>Settings</button>
      <button data-open="browser"><i>🌍</i>Browser</button><button data-open="calculator"><i>🧮</i>Calculator</button>
    </div>
    <div class="start-heading"><b>Recommended</b><span>More　›</span></div>
    <div class="recommended"><span>🌐</span><div><b>Website Maker</b><small>Create and export a website</small></div></div>
    <div class="start-footer"><span>👤 Local user</span><button id="powerButton" title="Power options">⏻</button></div>
    <div id="powerOptions" class="power-options hidden"><button data-power="lock">Lock</button><button data-power="restart">Restart</button></div>
  </section>
  <div id="windowLayer"></div>
  <div id="taskbar">
    <div class="taskbar-center">
      <button class="task-icon start-button" id="startButton" title="Start">⊞</button>
      <button class="task-search" id="taskSearch">⌕ <span>Search</span></button>
      <button class="task-icon" data-open="maker" title="Website Maker">🌐</button>
      <button class="task-icon" data-open="explorer" title="File Explorer">📁</button>
      <button class="task-icon" data-open="notepad" title="Notepad">📝</button>
      <button class="task-icon" data-open="settings" title="Settings">⚙️</button>
      <div id="runningApps"></div>
    </div>
    <div class="system-tray"><span title="Network">◉</span><span title="Volume">🔊</span><span title="Battery">▰</span><div class="clock"><b id="clockTime">--:--</b><small id="clockDate">---</small></div></div>
  </div>
  <div id="lockScreen" class="lock-screen hidden"><div class="lock-time" id="lockTime">--:--</div><div id="lockDate"></div><button id="unlockButton">Click to continue</button></div>
  <div id="toast" class="toast hidden"></div>
</div>
<script src="script.js"></script>
</body></html>
